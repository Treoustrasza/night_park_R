<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一副眼镜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap" />
<style>
/* ═══════════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════════ */
:root {
  --night-bg:   #0d0f1a;
  --lamp-amber: #f5c842;
  --bench-wood: #7a4f2d;
  --bench-iron: #3a3a4a;
  --vend-body:  #1e2a4a;
  --vend-red:   #ff4466;
  --text-main:  #f0e8d0;
  --overlay-bg: rgba(8, 10, 20, 0.93);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--night-bg);
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Press Start 2P', monospace;
  image-rendering: pixelated;
}

/* ═══════════════════════════════════════════════
   SCENE (pixel-night 公园背景)
═══════════════════════════════════════════════ */
#scene {
  width: 100%; height: 100%;
  position: relative;
  background: linear-gradient(180deg,
    #060810 0%, #0d1228 45%, #111830 70%, #1a2240 100%
  );
}
.stars { position: absolute; inset: 0; pointer-events: none; }
.star {
  position: absolute; background: #fff; border-radius: 50%;
  animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
}
@keyframes twinkle {
  from { opacity: var(--a1, 0.2); }
  to   { opacity: var(--a2, 0.9); }
}
#ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 28%;
  background: repeating-linear-gradient(
    90deg, #1c2235 0px, #1c2235 7px, #1a2030 7px, #1a2030 14px
  );
  border-top: 4px solid #2a3050;
}
#ground::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    180deg, transparent 0px, transparent 13px,
    rgba(255,255,255,0.04) 13px, rgba(255,255,255,0.04) 14px
  );
}
.lamp-wrap { position: absolute; bottom: 28%; }
.lamp-pole { width: 8px; background: #3a3d50; margin: 0 auto; border-radius: 2px 2px 0 0; }
.lamp-arm { width: 60px; height: 8px; background: #3a3d50; border-radius: 4px 4px 0 0; position: relative; }
.lamp-head {
  width: 28px; height: 14px; background: var(--lamp-amber);
  border-radius: 4px 4px 2px 2px; position: absolute; right: 0; top: 8px;
  box-shadow: 0 0 12px 6px rgba(245,200,66,0.55), 0 0 40px 20px rgba(245,200,66,0.18);
}
.lamp-cone {
  position: absolute; top: 22px; right: -20px; width: 120px; height: 200px;
  background: radial-gradient(ellipse at 50% 0%, rgba(245,200,66,0.13) 0%, rgba(245,200,66,0.04) 50%, transparent 100%);
  clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%); pointer-events: none;
}
#lamp-left { left: 12%; }
#lamp-left .lamp-pole { height: 220px; }
#lamp-left .lamp-arm  { transform: scaleX(-1); }
#lamp-right { right: 10%; }
#lamp-right .lamp-pole { height: 200px; }
#bench {
  position: absolute; bottom: calc(28% + 2px);
  left: 50%; transform: translateX(-50%);
}
.bench-back  { display: flex; gap: 4px; margin-bottom: 4px; }
.bench-plank { height: 12px; background: var(--bench-wood); border-radius: 2px; border-top: 2px solid #9a6a3d; border-bottom: 2px solid #5a3a1d; }
.bench-seat  { display: flex; gap: 4px; }
.bench-leg   { width: 8px; background: var(--bench-iron); border-radius: 2px; border-right: 2px solid #5a5a6a; }
.bench-support { width: 100%; height: 6px; background: var(--bench-iron); border-radius: 2px; margin-top: 2px; }
#vending { position: absolute; bottom: 28%; right: 22%; width: 72px; image-rendering: pixelated; }
.vend-body { width: 72px; height: 130px; background: var(--vend-body); border: 3px solid #2e3d6a; border-radius: 4px 4px 0 0; position: relative; overflow: hidden; }
.vend-brand { width: 100%; height: 18px; background: var(--vend-red); display: flex; align-items: center; justify-content: center; font-size: 5px; color: #fff; letter-spacing: 1px; }
.vend-window { margin: 6px auto; width: 54px; height: 60px; background: #0a1020; border: 2px solid #3a4a7a; border-radius: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 3px; padding: 4px; }
.vend-can { border-radius: 2px; position: relative; }
.vend-can::after { content: ''; position: absolute; top: 2px; left: 2px; right: 2px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 1px; }
.vend-panel { margin: 0 auto; width: 54px; height: 28px; background: #151e38; border: 2px solid #2a3a60; border-radius: 2px; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
.vend-btn { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
.vend-slot { width: 30px; height: 6px; background: #0a1020; border: 1px solid #2a3a60; border-radius: 1px; }
.vend-base { width: 72px; height: 8px; background: #1a2848; border: 3px solid #2e3d6a; border-top: none; border-radius: 0 0 3px 3px; }
.vend-body::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(160,232,255,0.06) 0%, transparent 70%); pointer-events: none; }
.tree { position: absolute; bottom: 28%; }
.tree-trunk { width: 10px; background: #1a1e2e; margin: 0 auto; }
.tree-top { background: #141828; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }

/* ═══════════════════════════════════════════════
   PIXEL-NIGHT OVERLAY（对话层）
═══════════════════════════════════════════════ */
#overlay {
  position: fixed; inset: 0;
  background: var(--overlay-bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 48px; z-index: 100;
}
#overlay.hidden { display: none; }

#overlay-text {
  color: var(--text-main);
  font-size: clamp(12px, 2.2vw, 20px);
  line-height: 1; text-align: center;
  text-shadow: 0 0 10px rgba(245,200,66,0.35), 2px 2px 0 rgba(0,0,0,0.8);
  max-width: 72vw;
  -webkit-font-smoothing: none; font-smooth: never;
}
.dialog-line {
  display: block; min-height: 2.2em; letter-spacing: 0.08em;
  text-shadow: 2px 2px 0 #000, 0 0 12px rgba(245,200,66,0.3);
}
.type-cursor {
  display: inline-block; color: var(--lamp-amber); font-size: 0.85em;
  vertical-align: baseline; animation: cursor-blink 0.7s step-end infinite;
  text-shadow: 0 0 8px rgba(245,200,66,0.8);
}
@keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.choices {
  display: flex; flex-direction: column; align-items: flex-start; gap: 22px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
.choices.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.choice-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(11px, 1.8vw, 16px); color: var(--text-main);
  background: transparent; border: none; outline: none;
  padding: 4px 0; cursor: pointer; letter-spacing: 0.05em;
  -webkit-font-smoothing: none; font-smooth: never;
  text-shadow: 2px 2px 0 #000, 0 0 8px rgba(245,200,66,0.2);
  animation: choice-appear 0.3s ease both;
  transition: color 0.15s, text-shadow 0.15s;
}
@keyframes choice-appear { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
.choice-arrow { display: inline-block; color: var(--lamp-amber); margin-right: 10px; font-size: 0.75em; opacity: 0.5; transition: opacity 0.15s, transform 0.15s; }
.choice-btn:hover { color: var(--lamp-amber); text-shadow: 2px 2px 0 #000, 0 0 14px rgba(245,200,66,0.6); }
.choice-btn:hover .choice-arrow { opacity: 1; transform: translateX(3px); }
.choice-btn:active { transform: scale(0.97); }

.deco-line { width: 180px; height: 2px; background: linear-gradient(90deg, transparent, var(--lamp-amber), transparent); opacity: 0.35; image-rendering: pixelated; }

#end-text {
  position: fixed; inset: 0; background: var(--overlay-bg); color: var(--text-main);
  font-family: 'Press Start 2P', monospace; font-size: clamp(12px, 2.2vw, 20px);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 36px; z-index: 200; text-align: center; padding: 20px;
  -webkit-font-smoothing: none; font-smooth: never; display: none;
}
#end-text.show { display: flex; }
#end-dialog .dialog-line { text-align: center; }

.pixel-corner {
  position: fixed; width: 20px; height: 20px;
  border-color: rgba(245,200,66,0.3); border-style: solid;
  z-index: 300; pointer-events: none;
}
.pixel-corner.tl { top: 16px; left: 16px;   border-width: 3px 0 0 3px; }
.pixel-corner.tr { top: 16px; right: 16px;  border-width: 3px 3px 0 0; }
.pixel-corner.bl { bottom: 16px; left: 16px;  border-width: 0 0 3px 3px; }
.pixel-corner.br { bottom: 16px; right: 16px; border-width: 0 3px 3px 0; }

#title-screen {
  position: fixed; inset: 0; background: #060810;
  display: flex; align-items: center; justify-content: center;
  z-index: 500; cursor: pointer;
  opacity: 1; visibility: visible; transition: opacity 0.7s ease;
}
#title-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
.title-inner { display: flex; flex-direction: column; align-items: center; gap: 32px; }
#title-cursor {
  font-family: 'Press Start 2P', monospace; font-size: clamp(18px, 3vw, 28px);
  color: var(--lamp-amber); -webkit-font-smoothing: none; font-smooth: never;
  text-shadow: 0 0 16px rgba(245,200,66,0.9), 0 0 32px rgba(245,200,66,0.4);
  animation: cursor-blink 0.7s step-end infinite;
}
#flash-screen {
  position: fixed; inset: 0; background: #fff;
  z-index: 600; display: none; pointer-events: none;
}
#flash-screen.flash-active {
  display: block; animation: flash-anim 2.2s ease-out forwards;
}
@keyframes flash-anim {
  0%   { opacity: 1; }
  15%  { opacity: 0.75; }
  40%  { opacity: 0.35; }
  100% { opacity: 0; }
}

/* ═══════════════════════════════════════════════
   GAME SCREEN（游戏主界面，初始隐藏）
   调性延续序章：深蓝夜色 + 琥珀金点缀
═══════════════════════════════════════════════ */
#game-screen {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #080c18 0%, #0d1228 60%, #111830 100%);
  z-index: 150;
  display: none;
  overflow-y: auto;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
  -webkit-font-smoothing: antialiased;
  image-rendering: auto;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 20px;
}
#game-screen.show { display: flex; }

/* 游戏内容容器 */
#game-inner {
  width: 100%;
  max-width: 720px;
  color: #d8cfc0;
}

/* ── 状态面板 ── */
#status-panel {
  background: rgba(13,18,40,0.7);
  border: 1px solid rgba(245,200,66,0.12);
  border-radius: 4px; padding: 14px 18px; margin-bottom: 18px;
}
.status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.status-row:last-child { margin-bottom: 0; }
.stat-label { width: 72px; font-size: 0.8em; color: #a09880; flex-shrink: 0;
  font-family: 'Noto Serif SC','SimSun',serif; letter-spacing: 0.05em; }
.stat-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.07); border-radius: 0; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 0; transition: width 0.6s ease; }
.bar-perf   { background: rgba(245,200,66,0.55); }
.bar-sanity { background: rgba(180,220,180,0.5); }
.bar-rep    { background: rgba(160,200,240,0.5); }
.bar-dep    { background: rgba(200,140,140,0.55); }
.stat-val { width: 32px; text-align: right; font-size: 0.78em; color: #a09880; flex-shrink: 0; }
.danger .stat-bar-fill { animation: pulse 1.2s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.35; } }
.date-info { display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; font-size: 0.78em; color: rgba(245,200,66,0.6);
  font-family: 'Noto Serif SC','SimSun',serif; letter-spacing: 0.08em; }
.glasses-count { color: rgba(245,200,66,0.45); font-size: 0.82em; letter-spacing: 0.05em; }

/* ── 叙事框 ── */
#narrative-box {
  background: rgba(13,18,40,0.5); border: 1px solid rgba(245,200,66,0.08);
  border-radius: 4px; padding: 20px 22px; margin-bottom: 18px;
  min-height: 100px; font-size: 0.92em; line-height: 2.1; color: #c8c0b0;
  font-family: 'Noto Serif SC','SimSun',serif;
}
.npc-line { margin: 4px 0; padding-left: 0; font-family: 'Noto Serif SC','SimSun',serif; }
.npc-leader   { color: #c0604a; }
.npc-colleague{ color: #b08050; }
.npc-mentor   { color: #7090b0; }
.npc-narrator { color: #787060; font-style: italic; }
.npc-self     { color: #d8cfc0; }
.highlight    { color: rgba(245,200,66,0.9); }
.bad-news     { color: #c05040; }
.good-news    { color: #80b080; }

/* ── 突发事件区 ── */
#event-section {
  background: rgba(13,18,40,0.5); border: 1px solid rgba(245,200,66,0.14);
  border-radius: 4px; padding: 18px 20px; margin-bottom: 18px;
}
#event-section h3 { font-size: 0.8em; color: rgba(245,200,66,0.7); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
  font-family: 'Noto Serif SC','SimSun',serif; letter-spacing: 0.1em; }
#event-desc { font-size: 0.88em; color: #c0b8a8; line-height: 2; margin-bottom: 14px;
  font-family: 'Noto Serif SC','SimSun',serif; }

/* ── 行动区 ── */
#action-section h3 { font-size: 0.78em; color: #706858; margin-bottom: 12px;
  font-family: 'Noto Serif SC','SimSun',serif; letter-spacing: 0.1em; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.action-btn {
  background: rgba(13,18,40,0.6); border: 1px solid rgba(245,200,66,0.1);
  color: #b8b0a0; padding: 10px 14px; border-radius: 2px; cursor: pointer;
  font-family: 'Noto Serif SC','SimSun',serif; font-size: 0.84em;
  line-height: 1.6; text-align: left; transition: all 0.18s;
}
.action-btn:hover { background: rgba(245,200,66,0.07); border-color: rgba(245,200,66,0.25); color: #e0d8c8; }
.action-btn.selected { background: rgba(245,200,66,0.1); border-color: rgba(245,200,66,0.4); color: #f0e8d0; }
.action-btn .action-effect { font-size: 0.76em; color: #605850; margin-top: 4px; }

/* ── 眼镜开关 ── */
#glasses-section { margin-bottom: 16px; }
.glasses-toggle-row {
  display: flex; align-items: center; gap: 12px;
  background: rgba(13,18,40,0.6); border: 1px solid rgba(245,200,66,0.1);
  border-radius: 2px; padding: 12px 16px; cursor: pointer; transition: all 0.18s;
}
.glasses-toggle-row:hover { border-color: rgba(245,200,66,0.22); background: rgba(245,200,66,0.05); }
.glasses-toggle-row.active { background: rgba(245,200,66,0.08); border-color: rgba(245,200,66,0.35); }
.glasses-icon { font-size: 1.1em; opacity: 0.7; }
.glasses-text { flex: 1; font-size: 0.86em; font-family: 'Noto Serif SC','SimSun',serif;
  color: #b0a890; }
.glasses-text small { display: block; color: #605850; font-size: 0.8em; margin-top: 3px; }
.toggle-indicator { width: 32px; height: 18px; background: rgba(255,255,255,0.07);
  border-radius: 0; position: relative; transition: background 0.2s;
  border: 1px solid rgba(255,255,255,0.1); }
.toggle-indicator::after { content: ''; position: absolute; top: 2px; left: 2px;
  width: 12px; height: 12px; background: #504840; border-radius: 0; transition: all 0.2s; }
.glasses-toggle-row.active .toggle-indicator { background: rgba(245,200,66,0.2);
  border-color: rgba(245,200,66,0.4); }
.glasses-toggle-row.active .toggle-indicator::after { left: 16px; background: rgba(245,200,66,0.85); }

/* ── 确认按钮 ── */
.btn-confirm {
  width: 100%; padding: 13px; font-size: 0.88em; border-radius: 2px; margin-top: 4px;
  background: transparent;
  color: rgba(245,200,66,0.55); border: 1px solid rgba(245,200,66,0.2); cursor: pointer;
  font-family: 'Noto Serif SC','SimSun',serif; letter-spacing: 0.15em;
  transition: all 0.2s;
}
.btn-confirm:hover:not(:disabled) { background: rgba(245,200,66,0.07);
  border-color: rgba(245,200,66,0.45); color: rgba(245,200,66,0.85); }
.btn-confirm:disabled { opacity: 0.25; cursor: not-allowed; }

/* ── 结局界面 ── */
#result-screen {
  display: none; text-align: center; padding: 48px 20px;
  font-family: 'Noto Serif SC','SimSun',serif;
}
#result-screen.show { display: block; }
#result-screen h2 { font-size: 1.5em; margin-bottom: 8px; color: #d8cfc0; letter-spacing: 0.08em; }
.result-tag { font-size: 0.75em; padding: 3px 12px; border-radius: 0;
  display: inline-block; margin-bottom: 24px; letter-spacing: 0.12em; }
.tag-bad    { background: rgba(180,60,50,0.15);  color: #c06050;
  border: 1px solid rgba(180,60,50,0.25); }
.tag-normal { background: rgba(100,130,160,0.15); color: #8090a8;
  border: 1px solid rgba(100,130,160,0.25); }
.tag-good   { background: rgba(80,150,100,0.15);  color: #70a880;
  border: 1px solid rgba(80,150,100,0.25); }
.result-text { background: rgba(13,18,40,0.5); border: 1px solid rgba(245,200,66,0.08);
  border-radius: 4px; padding: 22px 26px; text-align: left;
  font-size: 0.9em; line-height: 2.2; color: #b8b0a0; margin-bottom: 28px; }
.stats-summary { display: flex; gap: 14px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
.stat-chip { background: rgba(13,18,40,0.5); border: 1px solid rgba(245,200,66,0.1);
  border-radius: 2px; padding: 7px 14px; font-size: 0.78em; color: #807870; }
.stat-chip span { color: #c8c0b0; }
.btn-restart {
  background: transparent; color: rgba(245,200,66,0.5);
  border: 1px solid rgba(245,200,66,0.2); padding: 12px 40px; font-size: 0.88em;
  border-radius: 2px; cursor: pointer;
  font-family: 'Noto Serif SC','SimSun',serif; letter-spacing: 0.15em;
  transition: all 0.2s;
}
.btn-restart:hover { background: rgba(245,200,66,0.07); border-color: rgba(245,200,66,0.4);
  color: rgba(245,200,66,0.85); }

.game-divider { border: none; border-top: 1px solid rgba(245,200,66,0.06); margin: 16px 0; }
.g-fade-in { animation: gFadeIn 0.6s ease; }
@keyframes gFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.hidden-g { display: none !important; }
</style>
</head>
<body>

<!-- ══ 开场界面 ══ -->
<div id="title-screen">
  <div class="pixel-corner tl"></div>
  <div class="pixel-corner tr"></div>
  <div class="pixel-corner bl"></div>
  <div class="pixel-corner br"></div>
  <div class="title-inner">
    <span id="title-cursor">█</span>
  </div>
</div>

<!-- ══ 像素装饰角（主界面） ══ -->
<div class="pixel-corner tl"></div>
<div class="pixel-corner tr"></div>
<div class="pixel-corner bl"></div>
<div class="pixel-corner br"></div>

<!-- ══ 场景 ══ -->
<div id="scene">
  <div class="stars" id="stars"></div>
  <div class="lamp-wrap" id="lamp-left">
    <div class="lamp-arm"><div class="lamp-head"></div><div class="lamp-cone"></div></div>
    <div class="lamp-pole"></div>
  </div>
  <div class="lamp-wrap" id="lamp-right">
    <div class="lamp-arm"><div class="lamp-head"></div><div class="lamp-cone"></div></div>
    <div class="lamp-pole"></div>
  </div>
  <div class="tree" style="left:5%"><div class="tree-top" style="width:50px;height:80px;"></div><div class="tree-trunk" style="height:30px;"></div></div>
  <div class="tree" style="left:18%"><div class="tree-top" style="width:38px;height:60px;"></div><div class="tree-trunk" style="height:20px;"></div></div>
  <div class="tree" style="right:5%"><div class="tree-top" style="width:55px;height:90px;"></div><div class="tree-trunk" style="height:35px;"></div></div>
  <div class="tree" style="right:16%"><div class="tree-top" style="width:40px;height:65px;"></div><div class="tree-trunk" style="height:22px;"></div></div>
  <div id="bench">
    <div class="bench-back"><div class="bench-plank" style="width:160px;"></div></div>
    <div class="bench-seat"><div class="bench-plank" style="width:160px;"></div></div>

/* ══════════════════════════════════════
   Web Audio（柔和正弦波）
══════════════════════════════════════ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTypeSound() {
  try {
    const ctx  = getAudioCtx();
    const freq = 320 + Math.random() * 80;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    const lpf  = ctx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.75, ctx.currentTime + 0.08);
    lpf.type = 'lowpass'; lpf.frequency.value = 900;
    gain.gain.setValueAtTime(0.055, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
    osc.connect(lpf); lpf.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.13);
  } catch (e) {}
}

/* ══════════════════════════════════════
   打字机核心
══════════════════════════════════════ */
const textEl    = document.getElementById('overlay-text');
const choicesEl = document.getElementById('choices');
const endEl     = document.getElementById('end-text');
let typingTimer = null;

function parseSegments(line) {
  const segs = []; const re = /\{PAUSE:(\d+)\}/g;
  let last = 0, m;
  while ((m = re.exec(line)) !== null) {
    if (m.index > last) segs.push({ text: line.slice(last, m.index) });
    segs.push({ pause: parseInt(m[1]) });
    last = m.index + m[0].length;
  }
  if (last < line.length) segs.push({ text: line.slice(last) });
  return segs;
}

function typeTextInto(container, lines, onDone, append) {
  if (!append) container.innerHTML = '';
  if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
  if (append) { const old = container.querySelector('.type-cursor'); if (old) old.remove(); }
  const lineEls = lines.map(line => {
    const isBlankLine = line === '';
    const isFullPause = /^\{PAUSE:(\d+)\}$/.test(line);
    const p = document.createElement('p');
    p.className = 'dialog-line';
    if (isBlankLine || isFullPause) {
      p.innerHTML = '&nbsp;'; p.style.minHeight = '0';
      p.style.height = isFullPause ? '0' : '0.5em';
      p.style.overflow = 'hidden';
    }
    container.appendChild(p);
    return {
      el: p, segments: (isBlankLine || isFullPause) ? [] : parseSegments(line),
      fullPause: isFullPause ? parseInt(line.match(/\d+/)[0]) : 0,
      isEmpty: isBlankLine,
    };
  });
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor'; cursor.textContent = '█';
  let lineIdx = 0, segIdx = 0, charIdx = 0;

  function tick() {
    while (lineIdx < lineEls.length && lineEls[lineIdx].isEmpty) lineIdx++;
    if (lineIdx >= lineEls.length) {
      const lastReal = [...lineEls].reverse().find(l => !l.isEmpty && l.segments.length > 0);
      if (lastReal) lastReal.el.appendChild(cursor);
      if (onDone) onDone(); return;
    }
    const entry = lineEls[lineIdx];
    if (entry.fullPause > 0) {
      lineIdx++; segIdx = 0; charIdx = 0;
      typingTimer = setTimeout(tick, entry.fullPause); return;
    }
    const segs = entry.segments;
    if (segIdx === 0 && charIdx === 0) entry.el.appendChild(cursor);
    while (segIdx < segs.length && segs[segIdx].pause !== undefined) {
      const ms = segs[segIdx].pause; segIdx++;
      typingTimer = setTimeout(tick, ms); return;
    }
    if (segIdx >= segs.length) {
      lineIdx++; segIdx = 0; charIdx = 0;
      typingTimer = setTimeout(tick, 120); return;
    }
    const seg = segs[segIdx]; const text = seg.text;
    if (charIdx < text.length) {
      entry.el.insertBefore(document.createTextNode(text[charIdx]), cursor);
      charIdx++; playTypeSound();
      const ch = text[charIdx - 1];
      let delay;
      if      (/[。！？]/.test(ch)) delay = 420 + Math.random() * 80;
      else if (/[，、…]/.test(ch))  delay = 220 + Math.random() * 60;
      else if (/[～~]/.test(ch))    delay = 160;
      else                           delay = 95  + Math.random() * 40;
      typingTimer = setTimeout(tick, delay);
    } else { segIdx++; charIdx = 0; tick(); }
  }
  tick();
}

function typeText(lines, onDone) { typeTextInto(textEl, lines, onDone, false); }
function appendText(lines, onDone) { typeTextInto(textEl, lines, onDone, true); }

function showChoices(options) {

  gameScreen.style.opacity = '0';

  void gameScreen.offsetWidth;
  gameScreen.style.transition = 'opacity 1.2s ease';
  gameScreen.style.opacity = '1';

  setTimeout(() => {
    initGameState();
    renderStatusBars();
    setNarrative(buildDayNarrative());

    updateConfirmBtn();

══════════════════════════════════════════════════ */
function restartToTitle() {
  const scene = document.getElementById('scene');
  const gameScreen = document.getElementById('game-screen');

  // 隐藏游戏，重置结局
  document.getElementById('result-screen').classList.remove('show');
  // 游戏界面渐出
  gameScreen.style.transition = 'opacity 0.8s ease';
  gameScreen.style.opacity = '0';
  setTimeout(() => {
    gameScreen.classList.remove('show');
    gameScreen.style.transition = '';
    gameScreen.style.opacity = '';
    // 场景重新显示
    scene.style.transition = 'opacity 0.8s ease';
    scene.style.opacity = '1';
    // 重置 overlay
    overlay.style.clipPath = '';
    overlay.style.opacity  = '';
    overlay.classList.remove('hidden');
    // 重新开始对话
    setTimeout(() => {
      scene.style.transition = '';
      beginDialog();
    }, 200);
  }, 850);
}

/* ── 游戏状态 ── */
let G = {};

function initGameState() {
  G = {
    day: 1, perf: 50, sanity: 60, rep: 40, dep: 0,
    glassesUsed: 0, useGlassesToday: false,
    studyCount: 0,  // 自学次数
    learnCount: 0,  // 听课次数
    selectedAction: null, selectedEventChoice: null, currentEvent: null,
    eventPool: [...EVENTS],
  };
}

function dayOfWeek(day) { return ((day - 1) % 7) + 1; }
function isWeekend(day) { const d = dayOfWeek(day); return d === 6 || d === 7; }
function weekNum(day)   { return Math.ceil(day / 7); }
function dayName(day)   { return ['周一','周二','周三','周四','周五','周六','周日'][dayOfWeek(day)-1]; }
function monthDay(day) {
  const months = [31, 31, 30];
  let d = day, m = 0;
  while (d > months[m]) { d -= months[m]; m++; }
  return `${m + 3}月${d}日`;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function pickEvent() {
  const wk = weekNum(G.day);
  const eligible = G.eventPool.filter(e => e.week.includes(wk));
  if (!eligible.length || Math.random() > 0.40) return null;
  const idx = Math.floor(Math.random() * eligible.length);
  const ev = eligible[idx];
  G.eventPool = G.eventPool.filter(e => e.id !== ev.id);
  return ev;
}

function renderStatusBars() {
  [['perf',G.perf,G.perf<=20], ['sanity',G.sanity,G.sanity<=20], ['rep',G.rep,false], ['dep',G.dep,G.dep>=80]].forEach(([id,val,danger]) => {
    document.getElementById(`bar-${id}`).style.width = clamp(val,0,100) + '%';
    document.getElementById(`val-${id}`).textContent = clamp(val,0,100);
    document.getElementById(`row-${id}`).classList.toggle('danger', danger);
  });
  document.getElementById('date-display').textContent = `${monthDay(G.day)} · ${dayName(G.day)} · 第${G.day}天`;
  document.getElementById('glasses-used-count').textContent = G.glassesUsed;
}

function setNarrative(html) {
  const box = document.getElementById('narrative-box');
  box.innerHTML = html;
  box.classList.remove('g-fade-in');
  void box.offsetWidth;
  box.classList.add('g-fade-in');
}

function line(cls, text) { return `<div class="npc-line ${cls}">${text}</div>`; }

function buildDayNarrative() {
  const wk = weekNum(G.day);
  let html = `<div class="npc-narrator" style="color:#aaa;font-style:italic;">── ${monthDay(G.day)} ${dayName(G.day)}，第${wk}周 ──</div>`;
  if (G.day === 1) {
    html += line('npc-narrator','三月的第一天。你在这家公司已经两年了，工位还是那个工位，马克杯还是那个马克杯。');
    html += line('npc-narrator','只是上个月刚走了两个人。据说还有一轮考核。');
    html += line('npc-narrator','你把那副眼镜压在口袋最深处，打开电脑，登上钉钉，假装什么都没发生过。');
    html += line('npc-mentor','Mentor（路过你工位，压低声音）："来了。今天有个客户回访，注意点状态。"');
  } else if (G.day === 5) {
    html += line('npc-narrator','第一周结束了。你还在。');
    html += line('npc-narrator','HR下午找了一个设计师谈话，谈完那人直接回座位收了桌上的东西。');
    html += line('npc-narrator','你低着头，没看，假装在改稿。');
  } else if (G.day === 30) {
    html += line('npc-narrator','第一个月过去了。行业的新闻越来越难看，但组里没有人提，大家都在低头做事。');
    html += line('npc-leader','领导（月会上）："本月整体表现……中规中矩。大环境大家都知道，希望大家多出成果，让数字说话。"');
    html += line('npc-narrator','他扫了一圈，你觉得他的眼神在你身上多停了半秒。也许是错觉。');
  } else if (G.day === 60) {
    html += line('npc-narrator','两个月了。公司官网悄悄撤掉了招聘页面，大家心里都明白是什么意思。');
    html += line('npc-mentor','Mentor："最近感觉怎么样？"');
    html += line('npc-self','你："还行。"');
    html += line('npc-narrator','Mentor沉默了一下，端起杯子，没再追问。');
  } else if (G.perf <= 25) {
    html += line('npc-narrator','业绩不好看。你知道这意味着什么——上次裁员名单里，业绩垫底的人一个都没留下来。');
    html += line('npc-mentor','Mentor（皱着眉）："你这周的稿子……跟领导的要求差距有点大。要不要我帮你过一遍？"');
  } else if (G.sanity <= 25) {
    html += line('npc-narrator','你发现自己上班时会莫名其妙发呆，对着设计稿脑子里一片空白。');
    html += line('npc-narrator','已经不记得上次真心喜欢做一个东西是什么时候了。可能是入职前，可能是更早。');
  } else if (G.dep >= 70) {
    html += line('npc-narrator','你意识到，摘下眼镜盯着空白的画布，你不知道从哪里开始了。');
    html += line('npc-narrator','你试着回想，不戴它的时候你是怎么开始的——想不起来了。');
    html += line('npc-mentor','Mentor（若有所思）："你最近……好像不戴那个就做不下去了？"');
  } else {
    const flavors = [
      line('npc-narrator','又是普通的一天。咖啡机还是坏的，空调还是太冷，走廊里贴着的"降本增效"的海报换了新颜色。'),
      line('npc-colleague','同事（甩过来一份参考图）："这个风格你觉得能做吗？领导那边还在等，上次改了四遍他还不满意。"'),
      line('npc-narrator','楼道里有人在打电话，声音压得很低。你大概能猜到是什么事，但你没有精力在乎别人的事了。'),
      line('npc-mentor','Mentor："今天任务量不少，注意时间管理——对了，下周可能有客户突访，做好准备。"') + line('npc-self','你心想，哪个月不是这样。'),
      line('npc-narrator','你路过领导的工位，他正盯着某个数据表眉头紧锁。你悄悄加快了步伐，假装没看见。'),
      line('npc-colleague','同事（小声）："哎，听说这季度如果数字再差，年终奖就没了。你觉得是真的吗？"') + line('npc-self','你："……不知道。"'),
      line('npc-narrator','今天的工作量比想象中多，截止时间比想象中近。你已经不对这件事感到意外了。'),
    ];
    html += flavors[G.day % flavors.length];
  }
  return html;
}

function renderActions() {
  const actions = isWeekend(G.day) ? WEEKEND_ACTIONS : WEEKDAY_ACTIONS;
  document.getElementById('action-title').textContent = isWeekend(G.day) ? '今天是周末' : '今天的行动';
  const container = document.getElementById('action-choices');
  container.innerHTML = '';
  G.selectedAction = null;
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'action-btn'; btn.dataset.id = a.id;
    btn.innerHTML = `<strong>${a.label}</strong>`;
    btn.onclick = () => selectAction(a.id);
    container.appendChild(btn);
  });
}

function selectAction(id) {
  G.selectedAction = id;
  document.querySelectorAll('#action-choices .action-btn').forEach(b => b.classList.toggle('selected', b.dataset.id === id));
  updateConfirmBtn();
}

function renderEvent(ev) {
  G.currentEvent = ev; G.selectedEventChoice = null;
  const section = document.getElementById('event-section');
  section.classList.remove('hidden-g');
  document.getElementById('event-desc').textContent = ev.desc;
  document.getElementById('event-title-h3').textContent = `── ${ev.title}`;
  const container = document.getElementById('event-choices');
  container.innerHTML = '';
  ev.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'action-btn'; btn.dataset.key = c.key;
    btn.innerHTML = `<strong>${c.label}</strong>`;
    btn.onclick = () => selectEventChoice(c.key);
    container.appendChild(btn);
  });
}

function selectEventChoice(key) {
  G.selectedEventChoice = key;
  document.querySelectorAll('#event-choices .action-btn').forEach(b => b.classList.toggle('selected', b.dataset.key === key));
  updateConfirmBtn();
}

function toggleGlasses() {
  G.useGlassesToday = !G.useGlassesToday;
  document.getElementById('glasses-toggle').classList.toggle('active', G.useGlassesToday);
  document.getElementById('glasses-hint').textContent = G.useGlassesToday
    ? '应该会顺利很多吧'
    : '表现会不一样';
  updateConfirmBtn();
}

function updateConfirmBtn() {
  const btn = document.getElementById('confirm-btn');
  const needEvent = G.currentEvent !== null;
  const ready = G.selectedAction !== null && (!needEvent || G.selectedEventChoice !== null);
  btn.disabled = !ready;
  btn.textContent = ready ? '确认今日行动 →' : '请选择今天的行动';
}

function formatDeltas(dp, ds, dr, dd) {
  const fmt = (v, label) => {
    if (v === 0) return `<span style="color:#666">${label} ±0</span>`;
    return `<span style="color:${v>0?'#2ecc71':'#e74c3c'}">${label} ${v>0?'+':''}${v}</span>`;
  };
  return [fmt(dp,'业绩'), fmt(ds,'心态'), fmt(dr,'声誉'), dd>0?`<span style="color:#9b59b6">依赖度 +${dd}</span>`:''].filter(Boolean).join('　');
}

function confirmAction() {
  const actions = isWeekend(G.day) ? WEEKEND_ACTIONS : WEEKDAY_ACTIONS;
  const action = actions.find(a => a.id === G.selectedAction);
  const useGlass = G.useGlassesToday;
  let resultHTML = '', dp=0, ds=0, dr=0, dd=0;

  if (G.currentEvent) {
    const ev = G.currentEvent;
    const choiceKey = G.selectedEventChoice;
    const glassChosen = choiceKey === 'glass';
    const actualChoice = (glassChosen && !useGlass) ? ev.choices.find(c => c.key==='no_glass') : ev.choices.find(c => c.key===choiceKey);
    dp += actualChoice.perf; ds += actualChoice.sanity; dr += actualChoice.rep; dd += actualChoice.dep;
    resultHTML += `<div style="color:#f1c40f;font-weight:bold;margin-bottom:6px;">【${ev.title}】</div>`;
    resultHTML += line('npc-narrator', actualChoice.text);
    if (glassChosen && !useGlass) resultHTML += line('npc-narrator', '<em>（你选择了用那个方式处理，但今天没戴眼镜……只能靠自己发挥了。）</em>');
    resultHTML += '<br>';
  }

  if (useGlass) {
    dp += action.glassPerf; ds += action.glassSanity; dr += action.glassRep; dd += 10;
    G.glassesUsed++;
    resultHTML += line('npc-narrator', action.glassText);
  } else {
    dp += action.perf; ds += action.sanity; dr += action.rep;
    resultHTML += line('npc-narrator', action.normalText);
  }

  // 统计自学/听课次数，触发能力bonus
  let bonusMsg = '';
  if (action.id === 'wk_study') {
    G.studyCount++;
    if (G.studyCount === 10) bonusMsg = '你已经坚持自学了十次。那些笔记开始内化成真正的习惯——不戴眼镜完成任务时，表现会好一些了。';
    if (G.studyCount === 20) bonusMsg = '二十次自学积累下来，你能明显感觉到自己在进步。脑子里有些东西变扎实了。';
  }
  if (action.id === 'we_learn') {
    G.learnCount++;
    if (G.learnCount === 10) bonusMsg = '十次课程听下来，那些知识点开始真正沉淀——不戴眼镜完成任务时，表现会好一些了。';
    if (G.learnCount === 20) bonusMsg = '二十次课程之后，你已经把很多东西真正学会了。这给你一种安心感。';
  }

  // 不戴眼镜正常完成任务时，根据积累给bonus
  if (!useGlass && action.id === 'wk_normal') {
    const bonus = Math.floor((G.studyCount + G.learnCount) / 10);
    if (bonus > 0) { dp += bonus; dr += bonus; }
  }

  G.perf   = clamp(G.perf   + dp, 0, 100);
  G.sanity = clamp(G.sanity + ds, 0, 100);
  G.rep    = clamp(G.rep    + dr, 0, 100);
  G.dep    = clamp(G.dep    + dd, 0, 100);

  resultHTML += `<div style="margin-top:10px;font-size:0.8em;color:#888;">${formatDeltas(dp,ds,dr,dd)}</div>`;
  if (bonusMsg) resultHTML += `<div style="margin-top:10px;font-size:0.82em;color:rgba(245,200,66,0.7);font-family:'Noto Serif SC',serif;">${bonusMsg}</div>`;
  setNarrative(resultHTML);
  renderStatusBars();

  if (checkGameOver()) return;
  setTimeout(() => advanceDay(), 1800);
}

function checkGameOver() {
  if (G.dep >= 100)    { showEnding('dep_max');    return true; }
  if (G.perf <= 0)     { showEnding('perf_zero');  return true; }
  if (G.sanity <= 0)   { showEnding('sanity_zero');return true; }
  return false;
}

function advanceDay() {
  G.day++;
  G.useGlassesToday = false; G.selectedAction = null; G.selectedEventChoice = null; G.currentEvent = null;
  if (G.day > DAYS_TOTAL) { showEnding(); return; }
  document.getElementById('glasses-toggle').classList.remove('active');
  document.getElementById('glasses-hint').textContent = '表现会不一样';
  document.getElementById('event-section').classList.add('hidden-g');
  if (!isWeekend(G.day)) {
    G.sanity = clamp(G.sanity - 1, 0, 100);
    if (G.rep < 25) G.perf = clamp(G.perf - 1, 0, 100);
  }
  renderStatusBars();
  if (!isWeekend(G.day)) { const ev = pickEvent(); if (ev) renderEvent(ev); }
  setNarrative(buildDayNarrative());
  renderActions();
  updateConfirmBtn();
}

const ENDINGS = {
  dep_max: {
    title:'被时代淘汰', tag:'BAD END', tagClass:'tag-bad', titleColor:'#e74c3c',
    text:`它是在一条评论里开始的。<br><br>有人把你最近几个月的设计稿截图放在一起，配了一句话：<em>"这个人以前和现在的风格完全不像同一个人在做——因为本来就不是。"</em><br><br>评论区炸开了。有人认出了配色和构图特征，有人翻出你两年前刚入职时发过的作品——那些粗糙但真实的东西，和现在精准但空洞的输出放在一起，沉默比嘲讽更难受。<br><br>公司没有主动开除你，是客户陆续说"不想再合作了"。领导叫你进办公室，把合同放在桌上，说了一句你一辈子都会记得的话：<br><br><em class="npc-leader">"你在这里做了两年，我见过你最好的状态，也见过你后来的样子。最可惜的不是你用了那个东西——是你把自己交出去了，然后你以为没人看见。"</em><br><br>你把那副眼镜放回了口袋，但你发现自己拿起画笔，什么也画不出来了。<br><br><span class="bad-news">不是因为没有才华——是因为你已经忘了自己的才华在哪里了。</span>`,
  },
  perf_zero: {
    title:'被裁了', tag:'BAD END', tagClass:'tag-bad', titleColor:'#e74c3c',
    text:`HR很客气，给了你缓冲期，还帮你准备了推荐信。<br><br>领导在你离职前找你谈了一次，没有斥责，比你预想的平静。他说：<em>"你不是做不了这份工作。两年前你来的时候我就觉得你有点东西，但后来……你好像越来越不在了。我能分辨。"</em><br><br>你想辩解，但想到那些空白的下午，想到那些对着屏幕发呆的深夜，想到那副眼镜带给你的一次次临时胜利，你什么也没说。<br><br>Mentor在你最后一天请你吃了顿饭，聊了很多有的没的，最后才说：<em class="npc-mentor">"我一直想跟你说：你其实比你想的要能扛。我只是希望你早点告诉我哪里卡住了。"</em><br><br><span class="bad-news">你终于意识到，那副眼镜救不了一个已经不再真正尝试的人。</span>`,
  },
  sanity_zero: {
    title:'撑不住了', tag:'BAD END', tagClass:'tag-bad', titleColor:'#e74c3c',
    text:`那天下午你坐在工位上，电脑屏幕亮着，你看着那个空白画布，忽然发现自己不知道为什么要坐在这里。<br><br>不是累——是比累更深的东西。这根弦不知道从什么时候开始一直紧着，然后某一天，悄无声息地断了，你甚至没有感觉到疼痛。<br><br>Mentor发现你在茶水间站了很久，问你没事吧。你说没事，然后哭了。<br><br>你请了假。医生说需要休息，建议调整工作节奏。<br><br>那副眼镜一直放在抽屉里，你没有再碰它。<br><br><span class="bad-news">有些东西用工具可以撑住，但用工具撑不住的，是重新喜欢上一件事这件事本身。</span><br><br>你不知道还能不能找回来，但你开始慢慢试了。`,
  },
};

function getGoodEnding() {
  const g = G.glassesUsed, rep = G.rep;
  if (g === 0) return {
    title:'平凡，但是我的', tag:'TRUE END', tagClass:'tag-good', titleColor:'#58d68d',
    text:`三个月结束了，你一次都没有戴那副眼镜。<br><br>这条路走得很难。行业不好做，组里陆陆续续少了几张脸，有几次你差点排进末位名单，有几个深夜你对着那副眼镜发了很久的呆，然后把它收回抽屉里。<br><br>季度考核的会上，领导说了一句话，说的是你："这两年一直在，产出不是最好的，但我知道那都是你自己做的。在这种环境下，这比你想象中稀缺。"<br><br>你当时没太当回事，但后来想起来，那句话很重要。<br><br>Mentor请你喝咖啡，说："说实话，我一直以为你会用那个东西。但你没用。我不知道你是怎么撑过来的。"<br><br>那副眼镜还在口袋里。你不知道它是什么，也不知道那个黑衣人为什么给你，但你知道一件事：<br><br><span class="good-news">你交出去的每一份稿件，都是你自己的。好也好，差也好，都是你站在后面的。</span><br><br>这件事，没有任何工具能替你做到。`,
  };
  if (g <= 10 && rep >= 60) return {
    title:'工具是工具，人是人', tag:'GOOD END', tagClass:'tag-good', titleColor:'#58d68d',
    text:`三个月里，你偶尔戴过那副眼镜——大概几次，都是在真的撑不住的关键时刻。其他时候，你选择了靠自己的东西。<br><br>季度考核后，领导单独找你谈话，说了一段你记了很久的话："能用工具但没被工具带走，这是我在这个行业里见过的最难做到的一件事。"<br><br>你不确定他说的"工具"指的是眼镜还是别的什么，但你觉得自己听懂了。<br><br>散会后同事小声问你："你那副眼镜……是什么来的？"<br><br>你想了想，摘下来放在他手里："你试试。"<br><br>他戴上，沉默了一会儿，摘下来还给你，说："……有意思。但感觉不像我。"<br><br>你点了点头，<span class="good-news">说："对，就是这个感觉最重要。"</span>`,
  };
  if (g <= 25 && rep >= 50) return {
    title:'普通结局', tag:'NORMAL END', tagClass:'tag-normal', titleColor:'#5dade2',
    text:`三个月就这样过去了。你用了眼镜，也没用。有几次你觉得很依赖，又刻意收手，但没收得那么干净。<br><br>整体成绩过得去。考核结果出来，你的名字不在末位名单里——在这个时间点，这本身不是一件理所当然的事。Mentor说"有进步"，表情有点复杂。<br><br>你不知道那副眼镜的边界在哪里，也不再确定自己真实的水平是多少了——因为那条线已经模糊了。<br><br>续签了，工资涨了一点点。你站在公司楼下，把眼镜捏在手里看了很久。<br><br>明天要交一个新提案。你不知道今天要不要戴它。<br><br><span style="color:#aaa;">——这个问题，你以后还会面对很多次。</span>`,
  };
  return {
    title:'还好，活下来了', tag:'NORMAL END', tagClass:'tag-normal', titleColor:'#5dade2',
    text:`三个月，磕磕绊绊地过来了。<br><br>业绩没有特别好，也没有特别坏。那副眼镜你用了不少次，也拒绝了不少次。你还在，这件事本身已经比你想象中来之不易。<br><br>最后一周，领导把所有人叫在一起，念了几个"表现不错"的名字。你的名字不在里面，但你也不在末位那份要"进一步跟进"的名单上。<br><br>你走出公司，口袋里是那副眼镜。<br><br>Mentor追出来说了句"辛苦了"，你说"你也是"，然后各自走向各自的地铁站。<br><br>两年了。<br><br><span style="color:#aaa;">平凡的结局。但你还在这里，明天还要来上班——在这个时代，这本身就是一种答案。</span>`,
  };
}

function showEnding(type) {
  // 隐藏操作区，显示结局
  document.getElementById('action-section').style.display = 'none';
  document.getElementById('glasses-section').style.display = 'none';
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('event-section').classList.add('hidden-g');
  document.querySelector('.game-divider').style.display = 'none';

  const ending = (type && ENDINGS[type]) ? ENDINGS[type] : getGoodEnding();
  const rs = document.getElementById('result-screen');
  rs.classList.add('show');
  document.getElementById('result-title').textContent = ending.title;
  document.getElementById('result-title').style.color = ending.titleColor;
  document.getElementById('result-tag-container').innerHTML = `<div class="result-tag ${ending.tagClass}">${ending.tag}</div>`;
  document.getElementById('result-text').innerHTML = ending.text;
  document.getElementById('result-stats').innerHTML = `
    <div class="stat-chip">业绩 <span>${G.perf}</span></div>
    <div class="stat-chip">心态 <span>${G.sanity}</span></div>
    <div class="stat-chip">声誉 <span>${G.rep}</span></div>
    <div class="stat-chip">依赖度 <span>${G.dep}</span></div>
    <div class="stat-chip">眼镜使用 <span>${G.glassesUsed}</span> 次</div>
    <div class="stat-chip">坚持了 <span>${Math.min(G.day,DAYS_TOTAL)}</span> 天</div>
  `;
  // 滚动到结局
  rs.scrollIntoView({ behavior: 'smooth' });
}
